
<!DOCTYPE html>
<html>
<head>
    <title>Reaction Timer</title>
</head>
<body>

    <h2>Reaction Timer</h2>

    <p>Click the box when it turns green!</p>

    <div id="box"
         style="background:red; padding:80px; text-align:center;">
        Click to Start
    </div>

    <p id="result"></p>
    <p id="best"></p>

    <script>
        let box = document.getElementById("box");
        let result = document.getElementById("result");
        let best = document.getElementById("best");

        let startTime, timer;
        let state = "start";

        let bestTime = localStorage.getItem("bestTime");

        best.textContent = "Best Time: " + (bestTime || "--") + " ms";

        box.addEventListener("click", function() {

            if (state === "start" || state === "finished") {

                clearTimeout(timer);

                state = "waiting";
                box.style.background = "red";
                box.textContent = "Wait for green...";
                result.textContent = "";

                let delay = Math.floor(Math.random() * 4000) + 1000;

                timer = setTimeout(function() {
                    state = "ready";
                    box.style.background = "green";
                    box.textContent = "CLICK NOW!";
                    startTime = Date.now();
                }, delay);
            }

            else if (state === "waiting") {

                clearTimeout(timer);

                state = "finished";
                box.style.background = "orange";
                box.textContent = "Too early!";
                result.textContent = "Click to try again.";
            }

            else if (state === "ready") {

                let reactionTime = Date.now() - startTime;

                state = "finished";
                box.style.background = "lightblue";
                box.textContent = "Click to try again";

                result.textContent = "Your time: " + reactionTime + " ms";

                if (bestTime === null ||
                    reactionTime < Number(bestTime)) {

                    bestTime = reactionTime;

                    localStorage.setItem("bestTime", bestTime);

                    best.textContent = "Best Time: " + bestTime + " ms";
                }
            }
        });
    </script>

</body>
</html>
