<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            background-color: antiquewhite;

        }
        .box{
            height: 150px;
            width: 150px;
            text-align: center;
            font-weight: 100;

        }
        #box2{
            position:sticky;
            top:40%;
            left:50%;

        }
        #box3{
            position:sticky;
            top:50%;
            left:50%;
            
        }
        #box5{
            position:sticky;
            top:20%;
            left:50%;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="background-color: aqua;">1</div>
        <div class="box" id="box2" style="background-color: rgb(255, 0, 17);">2</div>
        <div class="box" id ="box3" style="background-color: rgb(251, 11, 155);">3</div>
        <div class="box" style="background-color: rgb(231, 148, 33);">4</div>
        <div class="box" id="box5" style="background-color: rgb(81, 74, 211);">5</div>
        <div class="box" style="background-color: rgb(52, 204, 49);">6</div>
        <div class="box" style="background-color: rgb(169, 61, 246);">7</div>
        <div class="box" style="background-color: rgb(233, 88, 109);">8</div>
        <div class="box" style="background-color: rgb(179, 116, 224);">9</div>
        <div class="box" style="background-color: rgb(130, 202, 234);">10</div>
        
    </div>
</body>
</html>
