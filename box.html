<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Gallery</title>
    <style>
        :root {
            --page: #071b2b;
            --gap: 15px;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(14px, 3vw, 42px);
            background: var(--page);
        }

        .container {
            width: min(1180px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 190px;
            gap: var(--gap);
        }

        .box {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border-radius: var(--radius);
            background: #123b58;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.2);
        }

        .box img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 350ms ease, filter 350ms ease;
        }

        .box:hover img {
            transform: scale(1.05);
            filter: saturate(1.12);
        }

        .feature {
            grid-column: span 2;
            grid-row: span 2;
        }

        .wide {
            grid-column: span 2;
        }

        .tall {
            grid-row: span 2;
        }

        @media (max-width: 760px) {
            .container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-auto-rows: 170px;
            }

            .feature {
                grid-column: span 2;
            }

            .wide {
                grid-column: span 2;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                grid-template-columns: 1fr;
                grid-auto-rows: 230px;
                gap: 10px;
            }

            .feature,
            .wide {
                grid-column: auto;
            }

            .tall {
                grid-row: auto;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="box feature">
            <img src="images/img1.jpg" alt="Boat on a tropical river">
        </div>
        <div class="box wide">
            <img src="images/img2.jpg" alt="Tropical beach and overwater bungalows">
        </div>
        <div class="box">
            <img src="images/img3.jpg" alt="Longtail boat in turquoise water">
        </div>
        <div class="box tall">
            <img src="images/img4.jpg" alt="Mountain lake with boats">
        </div>
        <div class="box">
            <img src="images/img5.jpg" alt="Mountain valley landscape">
        </div>
        <div class="box wide">
            <img src="images/img6.jpg" alt="Waterfall and mountain garden">
        </div>
        <div class="box">
            <img src="images/img7.jpg" alt="Paragliding over a green meadow">
        </div>
        <div class="box">
            <img src="images/img8.jpg" alt="Colorful riverside restaurant at night">
        </div>
        <div class="box">
            <img src="images/img9.jpg" alt="Snowy mountain resort">
        </div>
        <div class="box wide">
            <img src="images/img10.jpg" alt="City palace beside a lake at dusk">
        </div>
    </main>
</body>
</html>
