<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            background-color: antiquewhite;

        }
        .box{
            width: 100%;
            height: 100vh;
            text-align: center;
            font-weight: 100;
            position: relative;
            object-fit: contain;

        }
        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
       }
        #box1{
            position:sticky;
            top:0%;
        }
        #box2{
            position:sticky;
            top:5%;

        }
        #box3{
            position:sticky;
            top:10%;
            
        }
        #box4{
            position:sticky;
            top:15%;
            
        }
        #box5{
            position:sticky;
            top:20%;
            
        }
        #box6{
            position:sticky;
            top:25%;
            
        }
        #box7{
            position:sticky;
            top:30%;
            
        }
        #box8{
            position:sticky;
            top:35%;
            
        }
        #box9{
            position:sticky;
            top:40%;
            
        }
        #box10{
            position:sticky;
            top:90%;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"  id ="box1" style="background-color: aqua;">
            <img src="images/img1.jpg" alt="">
        </div>
        <div class="box" id="box2" style="background-color: rgb(255, 0, 17);">
            <img src="images/img2.jpg" alt="">
        </div>
        <div class="box" id ="box3" style="background-color: rgb(251, 11, 155);">
            <img src="images/img3.jpg" alt="">
        </div>
        <div class="box" id="box4" style="background-color: rgb(231, 148, 33);">
            <img src="images/img4.jpg" alt="">
        </div>
        <div class="box" id="box5" style="background-color: rgb(81, 74, 211);">
            <img src="images/img5.jpg" alt="">
        </div>
        <div class="box" id="box6" style="background-color: rgb(52, 204, 49);">
            <img src="images/img6.jpg" alt="">
        </div>
        <div class="box" id="box7" style="background-color: rgb(169, 61, 246);">
            <img src="images/img7.jpg" alt="">
        </div>
        <div class="box" id="box8" style="background-color: rgb(233, 88, 109);">
            <img src="images/img8.jpg" alt="">
        </div>
        <div class="box" id="box9" style="background-color: rgb(179, 116, 224);">
            <img src="images/img9.jpg" alt="">
        </div>
        <div class="box" id="box10" style="background-color: rgb(130, 202, 234);">
            <img src="images/img10.jpg" alt="">
        </div>
        
    </div>
</body>
</html>
