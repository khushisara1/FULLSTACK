<html>
    <head>
        <style>
            .grid-container {
                display: grid;
                background-color: #b4b7b8;
                padding: 10px;
                gap: 20px;
                max-width: 1200px;
                margin: 0 auto;
                grid-template-areas:
                    "box1 box2 box3"
                    "box4 box5 box6"
                    "box7 box8 box9"
                    "box10 box11 box12";
            }
            .box {
                background-color: #e23d7d;
                padding: 10px;
                display: flex;
                align-items: center;
                border: 2px solid #bfc3c5;
                justify-content: center;
                text-align: center;
                font-size: 20px;
                border-radius: 10px;
            }
            @media (max-width: 500px) {
                .grid-container {
                    grid-template-columns: 1fr;
                    grid-template-areas:
                        "box1 box2 box3"
                        "box4 box5 box6"
                        "box7 box8 box9"
                        "box10 box11 box12";
                }
            }
        </style>
    </head>
    <body class = "grid-container">
        <div class = "box" style="grid-area: box1;">One</div>
        <div class = "box" style="grid-area: box2;">Two</div>
        <div class = "box" style="grid-area: box3;">Three</div>
        <div class = "box" style="grid-area: box4;">Four</div>
        <div class = "box" style="grid-area: box5;">Five</div>
        <div class = "box" style="grid-area: box6;">Six</div>
        <div class = "box" style="grid-area: box7;">Seven</div>
        <div class = "box" style="grid-area: box8;">Eight</div>
        <div class = "box" style="grid-area: box9;">Nine</div>
        <div class = "box" style="grid-area: box10;">Ten</div>
        <div class = "box" style="grid-area: box11;">Eleven</div>
        <div class = "box" style="grid-area: box12;">Twelve</div>
        
    </body>
</html>
