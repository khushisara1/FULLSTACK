<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Cards</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #667085;
            --purple: #6938ef;
            --pink: #d946ef;
            --surface: #f5f3ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f3f6ff, #fcecff);
            color: var(--ink);
            font-family: Arial, sans-serif;
        }

        .power-section {
            width: min(760px, 100%);
        }

        .heading {
            margin-bottom: 24px;
        }

        .heading p {
            margin: 0 0 8px;
            color: var(--purple);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .heading h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.6rem);
        }

        .heading small {
            display: block;
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .card {
            min-height: 230px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            border-radius: 20px;
            color: white;
            background: linear-gradient(145deg, var(--purple), #4321a8);
            box-shadow: 0 16px 30px rgba(69, 39, 168, 0.22);
        }

        .card::before {
            content: "";
            width: 130px;
            height: 130px;
            position: absolute;
            top: -42px;
            right: -30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
        }

        .card:nth-child(2) {
            background: linear-gradient(145deg, var(--pink), #a21caf);
            box-shadow: 0 16px 30px rgba(162, 28, 175, 0.2);
        }

        .card-number,
        .card h2,
        .card p {
            position: relative;
            z-index: 1;
        }

        .card-number {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 1.7rem;
        }

        .card p {
            max-width: 230px;
            margin: 0;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.5;
        }

        @media (max-width: 560px) {
            body {
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .card {
                min-height: 190px;
            }
        }
    </style>
</head>
<body>
    <main class="power-section">
        <header class="heading">
            <p>Build your strength</p>
            <h1>Power cards</h1>
            <small>Two simple ideas to keep your progress moving.</small>
        </header>

        <section class="cards">
            <article class="card" id="box1">
                <span class="card-number">01 / FOCUS</span>
                <div>
                    <h2>Stay focused</h2>
                    <p>Small steps become strong habits when you keep showing up.</p>
                </div>
            </article>

            <article class="card" id="box2">
                <span class="card-number">02 / ENERGY</span>
                <div>
                    <h2>Keep moving</h2>
                    <p>Use your energy well and turn today’s effort into tomorrow’s progress.</p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
