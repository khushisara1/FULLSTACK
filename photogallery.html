<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento Gallery</title>

<style>

.bento-grid {
    display: grid;

    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 200px);

    gap: 16px;
}

.card {
    background: #f5f5f5;
    border-radius: 20px;
    padding: 20px;
}

/* Large card */
.card1 {
    grid-column: span 2;
    grid-row: span 2;
}

/* Normal card */
.card2 {
    grid-column: span 2;
}

/* Wide card */
.card3 {
    grid-column: span 2;
}

/* Tall card */
.card4 {
    grid-row: span 2;
}

/* Wide card */
.card5 {
    grid-column: span 2;
}

</style>
</head>

<body>

<div class="bento-grid">
    <div class="card card1">Profile</div>
    <div class="card card2">Statistics</div>
    <div class="card card3">Projects</div>
    <div class="card card4">Activity</div>
    <div class="card card5">AI Assistant</div>
</div>
</body>
</html>
