<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        :root {
            --ink: #172033;
            --muted: #526078;
            --accent: #e46f4f;
            --card: rgba(187, 178, 178, 0.9);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 25px;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            background:
                linear-gradient(135deg, rgba(5, 52, 83, 0.82), rgba(35, 113, 130, 0.5)),
                url("images/img3.jpg") center / cover no-repeat;
        }

        .welcome {
            width: min(760px, 100%);
            padding: clamp(28px, 6vw, 64px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 24px;
            background: var(--card);
            box-shadow: 0 24px 60px rgba(10, 34, 48, 0.3);
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--accent);
            font: bold 0.78rem Arial, sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--ink);
            font-size: clamp(2.8rem, 8vw, 5.5rem);
            line-height: 0.95;
        }

        .line {
            width: 72px;
            height: 5px;
            margin: 24px 0;
            border-radius: 5px;
            background: var(--accent);
        }

        h2 {
            max-width: 650px;
            margin: 0;
            color: var(--muted);
            font-size: clamp(1.1rem, 2.5vw, 1.45rem);
            font-weight: normal;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main class="welcome">
        <p class="eyebrow">A little welcome note</p>
        <h1>Hello Guys</h1>
        <div class="line"></div>
        <h2>Lorem ipsum hello, how you guys are here doing sit amethow are you adipisicing elit Totam mollitia atque earum  quibusdam quam, et veniam nisi, hic, omnis architecto quas illum soluta. Veniam, blanditiis dolore?</h2>
    </main>
</body>
</html>
